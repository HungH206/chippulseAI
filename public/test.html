<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChipPulse API Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #1e293b;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }
        
        input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        
        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        button {
            padding: 12px 32px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #2563eb;
        }
        
        button:active {
            background: #1d4ed8;
        }
        
        button:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }
        
        .output-section {
            margin-top: 30px;
        }
        
        .output-label {
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }
        
        .json-output {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #1e293b;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .loading {
            color: #64748b;
            font-style: italic;
            padding: 16px;
            text-align: center;
        }
        
        .error {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 16px;
        }
        
        .success {
            background: #dcfce7;
            border: 1px solid #bbf7d0;
            color: #166534;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ChipPulse API Test</h1>
        <p class="subtitle">Test the /api/analyze endpoint</p>
        
        <form id="analyzeForm">
            <div class="form-group">
                <input 
                    type="text" 
                    id="component" 
                    placeholder="Enter component name..." 
                    value="NVIDIA Blackwell B200"
                    required
                >
                <button type="submit" id="analyzeBtn">Analyze</button>
            </div>
        </form>
        
        <div class="output-section" id="outputSection" style="display: none;">
            <div class="output-label">Raw JSON Response:</div>
            <div id="jsonOutput" class="json-output"></div>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('analyzeForm');
        const componentInput = document.getElementById('component');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const outputSection = document.getElementById('outputSection');
        const jsonOutput = document.getElementById('jsonOutput');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const component = componentInput.value.trim();
            if (!component) {
                alert('Please enter a component name');
                return;
            }
            
            // Show loading state
            analyzeBtn.disabled = true;
            analyzeBtn.textContent = 'Analyzing...';
            outputSection.style.display = 'block';
            jsonOutput.innerHTML = '<div class="loading">⏳ Waiting for response...</div>';
            
            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ component })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                // Pretty print JSON
                jsonOutput.textContent = JSON.stringify(data, null, 2);
                jsonOutput.innerHTML = `<div style="color: #059669; font-weight: 600; margin-bottom: 12px;">✓ Success</div>` + 
                    `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                jsonOutput.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
                console.error('API Error:', error);
            } finally {
                analyzeBtn.disabled = false;
                analyzeBtn.textContent = 'Analyze';
            }
        });
        
        // Auto-focus on input
        componentInput.focus();
    </script>
</body>
</html>
